<!DOCTYPE html>
<html>
<head>
<title>Helpdesk Copilot</title>

<style>
body { display:flex; margin:0; font-family:Arial; background:#0b1220; color:white; }
.sidebar { width:250px; background:#111827; padding:10px; }
.main { flex:1; padding:20px; }
.chat { height:60vh; overflow:auto; background:#1f2937; padding:10px; border-radius:10px; }
.msg { margin:8px 0; padding:10px; border-radius:8px; }
.user { background:#2563eb; }
.bot { background:#374151; }
input { width:80%; padding:10px; }
button { padding:10px; margin:5px; cursor:pointer; }
.session { background:#1f2937; padding:5px; margin:5px 0; cursor:pointer; }
</style>

</head>
<body>

<div class="sidebar">
<h3>Sessions</h3>
<button onclick="newSession()">+ New</button>
<div id="sessions"></div>
</div>

<div class="main">
<h2>Helpdesk Copilot</h2>

<div id="chat" class="chat"></div>

<input id="input" placeholder="Describe issue...">
<button onclick="send()">Send</button>

</div>

<script>

const chat = document.getElementById("chat");

function add(text, cls){
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}

async function send(){
    const msg = input.value.trim();
    if(!msg) return;

    add(msg,"user");
    input.value = "";

    try{
        const res = await fetch("/ask",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:msg})
        });

        const data = await res.json();

        add(data.response,"bot");
        renderSessions(data.sessions);

    }catch(e){
        add("⚠ Server error","bot");
        console.error(e);
    }
}

async function renderSessions(sessions){
    const box = document.getElementById("sessions");
    box.innerHTML = "";

    sessions.forEach(s=>{
        const div = document.createElement("div");
        div.className="session";
        div.textContent = s.name || "Issue";

        div.onclick = async ()=>{
            await fetch("/switch_session",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({sid:s.id})
            });

            loadChat(s.messages);
        };

        box.appendChild(div);
    });
}

function loadChat(messages){
    chat.innerHTML="";
    messages.forEach(m=>{
        add(m.text, m.role);
    });
}

async function newSession(){
    const res = await fetch("/new_session",{method:"POST"});
    const data = await res.json();
    renderSessions([data]);
    chat.innerHTML="";
}

// ENTER KEY FIX
input.addEventListener("keydown", e=>{
    if(e.key==="Enter") send();
});

</script>

</body>
</html>
