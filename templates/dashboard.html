<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Troubleshooting Dashboard v15</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: #0f172a;
    border-right: 1px solid #1f2937;
    padding: 12px;
    display: flex;
    flex-direction: column;
}

.sidebar h3 {
    margin: 0 0 10px 0;
    font-size: 13px;
    opacity: 0.8;
}

.session {
    padding: 8px;
    background: #1f2937;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 12px;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* CHAT */
.chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.msg {
    max-width: 70%;
    padding: 10px;
    border-radius: 10px;
    white-space: pre-wrap;
    font-size: 13px;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #1f2937;
}

/* INPUT */
.inputbar {
    display: flex;
    padding: 10px;
    border-top: 1px solid #1f2937;
    background: #0f172a;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1f2937;
    color: white;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

/* RIGHT PANEL */
.right {
    width: 280px;
    background: #0f172a;
    border-left: 1px solid #1f2937;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card {
    background: #1f2937;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
}

.fixbtn {
    background: #334155;
    padding: 8px;
    margin-top: 6px;
    border-radius: 6px;
    cursor: pointer;
}

.fixbtn:hover {
    background: #475569;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h3>SESSIONS</h3>
    <div class="session">Active Session</div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="chat" id="chat"></div>

    <div class="inputbar">
        <input id="input" placeholder="Describe the issue..." />
        <button onclick="send()">Send</button>
    </div>

</div>

<!-- RIGHT PANEL -->
<div class="right">
    <div class="card">
        <b>Status</b>
        <div id="status">Idle</div>
    </div>

    <div class="card">
        <b>Response Time</b>
        <div id="time">-</div>
    </div>

    <div class="card">
        <b>Quick Fixes</b>
        <div id="fixes">None yet</div>
    </div>
</div>

<script>

let messages = [];

function render() {
    const chat = document.getElementById("chat");
    chat.innerHTML = "";

    messages.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg " + (m.role === "user" ? "user" : "bot");
        div.textContent = m.content;
        chat.appendChild(div);
    });

    chat.scrollTop = chat.scrollHeight;
}

function extractFixes(text) {
    const fixes = [];

    text.split("\n").forEach(line => {
        if (line.toLowerCase().includes("fix:")) {
            fixes.push(line.replace(/fix:/i, "").trim());
        }
    });

    const box = document.getElementById("fixes");
    box.innerHTML = fixes.length ? "" : "None yet";

    fixes.forEach(f => {
        const b = document.createElement("div");
        b.className = "fixbtn";
        b.innerText = f;

        b.onclick = () => {
            const input = document.getElementById("input");
            input.value = f;
            input.focus();
        };

        box.appendChild(b);
    });
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    messages.push({ role: "user", content: text });
    render();

    input.value = "";
    input.focus();

    document.getElementById("status").innerText = "Analyzing...";

    const start = Date.now();

    const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    const time = ((Date.now() - start) / 1000).toFixed(2);
    document.getElementById("time").innerText = time + "s";

    messages.push({ role: "assistant", content: data.response });
    render();

    extractFixes(data.response);

    document.getElementById("status").innerText = "Idle";
}

/* ENTER KEY SUPPORT */
document.getElementById("input").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
    }
});

</script>

</body>
</html>
