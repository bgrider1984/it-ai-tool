<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Helpdesk</title>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:#e5e7eb; }
header { padding:12px; background:#111827; }

.container {
    display:grid;
    grid-template-columns: 2fr 1fr;
    height: calc(100vh - 50px);
}

.left, .right { padding:15px; }
.left { border-right:1px solid #1f2937; }

textarea {
    width:100%;
    height:90px;
    background:#111827;
    color:white;
    border:1px solid #1f2937;
    padding:10px;
}

button {
    margin-top:10px;
    padding:8px 12px;
    background:#2563eb;
    border:none;
    color:white;
    cursor:pointer;
}

.card {
    background:#111827;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
}

.timeline {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:180px;
    background:#020617;
    overflow-y:auto;
    padding:10px;
    font-size:12px;
}

.error { color:#f87171; }
.loading { color:#fbbf24; }
</style>
</head>

<body>

<header>AI Helpdesk</header>

<div class="container">

<div class="left">

<textarea id="input" placeholder="Describe your issue..."></textarea>

<br>
<button id="analyzeBtn">Analyze</button>

<div class="card">
<b>Analysis</b>
<div id="analysis">Waiting...</div>
</div>

<div class="card">
<b>Fixes</b>
<div id="fixes"></div>
</div>

</div>

<div class="right">

<div class="card">
<b>System Monitor</b>
<div id="monitor"></div>
</div>

<div class="card">
<b>Errors</b>
<div id="errors" class="error"></div>
</div>

</div>

</div>

<div class="timeline" id="timeline"></div>

<script>

// 🔥 GUARANTEED BUTTON + ENTER WIRING
const input = document.getElementById("input");
const analyzeBtn = document.getElementById("analyzeBtn");

analyzeBtn.addEventListener("click", run);

input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        run();
    }
});

function showError(msg){
    document.getElementById("errors").innerText = msg;
}

function clearError(){
    document.getElementById("errors").innerText = "";
}

async function run(){
    try {
        clearError();

        const text = input.value.trim();
        if(!text) return;

        document.getElementById("analysis").innerHTML =
            "<span class='loading'>Analyzing...</span>";

        const res = await fetch("/api/run",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({text})
        });

        const json = await res.json();

        console.log("API RESPONSE:", json);

        if(!json.success){
            showError(json.error || "Unknown error");
            document.getElementById("analysis").innerText = "Error occurred";
            return;
        }

        const data = json.data || {};

        // ✅ FIXED PARSING
        document.getElementById("analysis").innerText =
            data.analysis || "No analysis returned";

        // FIXES
        const fixesDiv = document.getElementById("fixes");
        fixesDiv.innerHTML = "";

        (data.fixes || []).forEach(f=>{
            fixesDiv.innerHTML += `
            <div>
                ${f.label}
                <button onclick="runFix('${f.id}')">Run</button>
                <button onclick="verifyFix('${f.id}')">Verify</button>
            </div>`;
        });

        loadTimeline();

    } catch (err){
        showError(err.message);
        document.getElementById("analysis").innerText = "Request failed";
    }
}

async function runFix(id){
    await fetch("/api/fix",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix:id})
    });
    loadTimeline();
}

async function verifyFix(id){
    await fetch("/api/verify",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix:id})
    });
    loadTimeline();
}

async function loadTimeline(){
    try {
        const res = await fetch("/api/case");
        const json = await res.json();

        if(!json.success) return;

        const t = document.getElementById("timeline");
        t.innerHTML = "";

        (json.data.history || []).slice(-10).reverse().forEach(h=>{
            t.innerHTML += `
            <div>
                <b>${h.type}</b>: ${h.input || h.fix}
            </div>`;
        });

    } catch(e){
        showError(e.message);
    }
}

async function monitor(){
    try {
        const res = await fetch("/api/monitor");
        const json = await res.json();

        if(!json.success) return;

        const m = json.data.metrics;

        document.getElementById("monitor").innerText =
            `CPU: ${m.cpu}% | Memory: ${m.memory}%`;

    } catch(e){
        showError(e.message);
    }
}

setInterval(monitor, 3000);

</script>

</body>
</html>
