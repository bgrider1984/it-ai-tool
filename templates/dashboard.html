<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Helpdesk v3</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: #e2e8f0;
}

header {
    padding: 15px;
    background: #111827;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    height: calc(100vh - 60px);
}

.left, .right {
    padding: 20px;
}

.left {
    border-right: 1px solid #1f2937;
}

textarea {
    width: 100%;
    height: 120px;
    background: #1f2937;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
}

button {
    margin-top: 10px;
    padding: 10px;
    background: #2563eb;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 6px;
}

.card {
    background: #1f2937;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.title {
    color: #60a5fa;
    font-weight: bold;
    margin-bottom: 10px;
}

.item {
    padding: 5px 0;
    border-bottom: 1px solid #374151;
}

.small {
    font-size: 12px;
    color: #94a3b8;
}
</style>
</head>

<body>

<header>AI Helpdesk Agent System v3</header>

<div class="container">

<div class="left">

<h3>Issue Input</h3>

<textarea id="input"></textarea>

<button onclick="run()">Analyze</button>

<div class="card">
<div class="title">AI Analysis</div>
<div id="analysis"></div>
</div>

<div class="card">
<div class="title">Follow-up Questions</div>
<div id="questions"></div>
</div>

</div>

<div class="right">

<div class="card">
<div class="title">Facts</div>
<div id="facts"></div>
</div>

<div class="card">
<div class="title">Fixes</div>
<div id="fixes"></div>
</div>

<div class="card">
<div class="title">Confidence</div>
<div id="confidence"></div>
</div>

<div class="card">
<div class="title">Category</div>
<div id="category"></div>
</div>

</div>

</div>

<script>
async function run() {
    const text = document.getElementById("input").value;

    const res = await fetch("/api/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    });

    const data = await res.json();

    document.getElementById("analysis").innerText = data.analysis;

    document.getElementById("category").innerText = data.category;

    document.getElementById("confidence").innerText =
        (data.confidence * 100).toFixed(1) + "%";


    // facts
    const facts = document.getElementById("facts");
    facts.innerHTML = "";
    (data.facts || []).forEach(f => {
        facts.innerHTML += "<div class='item'>• " + f + "</div>";
    });

    // fixes
    const fixes = document.getElementById("fixes");
    fixes.innerHTML = "";
    (data.fixes || []).forEach(f => {
        fixes.innerHTML += "<div class='item'>→ " + f + "</div>";
    });

    // questions
    const q = document.getElementById("questions");
    q.innerHTML = "";
    (data.questions || []).forEach(x => {
        q.innerHTML += "<div class='item'>? " + x + "</div>";
    });
}
</script>

</body>
</html>
