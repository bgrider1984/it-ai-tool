<!-- ONLY SHOWING FIX AREA -->

<div id="fixes"></div>

<script>
async function run(){
    const text = document.getElementById("input").value;

    const res = await fetch("/api/run",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text})
    });

    const data = await res.json();

    const fixesDiv = document.getElementById("fixes");
    fixesDiv.innerHTML = "";

    data.fixes.forEach(f=>{
        fixesDiv.innerHTML += `
        <div>
            ${f.label}
            <button onclick="runFix('${f.id}')">Run</button>
            <button onclick="verifyFix('${f.id}')">Verify</button>
        </div>`;
    });
}

async function runFix(id){
    await fetch("/api/fix",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix:id})
    });
}

async function verifyFix(id){
    await fetch("/api/verify",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix:id})
    });
}
</script>
