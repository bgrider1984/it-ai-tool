<script>

document.addEventListener("DOMContentLoaded", () => {

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    if (!chat || !input) {
        console.error("Missing chat or input element");
        return;
    }

    // ----------------------------
    // ADD MESSAGE
    // ----------------------------
    function add(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.textContent = text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // ----------------------------
    // SEND MESSAGE
    // ----------------------------
    async function send() {

        const msg = input.value.trim();
        if (!msg) return;

        add(msg, "user");
        input.value = "";

        try {
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg })
            });

            const data = await res.json();

            add(data.response || "No response", "bot");

            if (data.sessions) {
                loadSessions(data.sessions);
            }

        } catch (err) {
            console.error(err);
            add("⚠ Server connection error", "bot");
        }
    }

    // ----------------------------
    // ENTER KEY FIX (ROBUST)
    // ----------------------------
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            send();
        }
    });

    // ----------------------------
    // OPTIONAL: BUTTON HOOK (SAFE)
    // ----------------------------
    window.send = send;

    // ----------------------------
    // LOAD SESSIONS (SAFE)
    // ----------------------------
    function loadSessions(sessions) {
        const box = document.getElementById("sessions");
        if (!box || !sessions) return;

        box.innerHTML = "";

        sessions.forEach(s => {
            const d = document.createElement("div");
            d.className = "session";
            d.textContent = s.title || "Session";
            box.appendChild(d);
        });
    }

    // expose if needed
    window.loadSessions = loadSessions;

});
</script>
