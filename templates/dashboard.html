<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Helpdesk</title>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:#e5e7eb; }
header { padding:12px; background:#111827; font-weight:bold; }

.container {
    display:grid;
    grid-template-columns: 2fr 1fr;
    height: calc(100vh - 50px);
}

.left, .right { padding:15px; }
.left { border-right:1px solid #1f2937; }

textarea {
    width:100%;
    height:90px;
    background:#111827;
    color:white;
    border:1px solid #1f2937;
    padding:10px;
}

button {
    margin-top:10px;
    padding:8px 12px;
    background:#2563eb;
    border:none;
    color:white;
    cursor:pointer;
}

.card {
    background:#111827;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
}

.timeline {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:180px;
    background:#020617;
    overflow-y:auto;
    padding:10px;
}
</style>
</head>

<body>

<header>AI Helpdesk</header>

<div class="container">

<div class="left">

<textarea id="input" placeholder="Describe your issue..."></textarea>

<br>
<button onclick="run()">Analyze</button>

<div class="card">
<b>Analysis</b>
<div id="analysis"></div>
</div>

<div class="card">
<b>Fixes</b>
<div id="fixes"></div>
</div>

</div>

<div class="right">

<div class="card">
<b>System Monitor</b>
<div id="monitor"></div>
</div>

</div>

</div>

<div class="timeline" id="timeline"></div>

<script>

async function run(){
    const text = document.getElementById("input").value;

    const res = await fetch("/api/run",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text})
    });

    const data = await res.json();

    document.getElementById("analysis").innerText = data.analysis || "No response";

    const fixesDiv = document.getElementById("fixes");
    fixesDiv.innerHTML = "";

    (data.fixes || []).forEach(f=>{
        fixesDiv.innerHTML += `
        <div>
            ${f.label}
            <button onclick="runFix('${f.id}')">Run</button>
            <button onclick="verifyFix('${f.id}')">Verify</button>
        </div>`;
    });

    loadTimeline();
}

async function runFix(id){
    await fetch("/api/fix",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix:id})
    });
}

async function verifyFix(id){
    await fetch("/api/verify",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix:id})
    });
}

async function loadTimeline(){
    const res = await fetch("/api/case");
    const data = await res.json();

    const t = document.getElementById("timeline");
    t.innerHTML = "";

    (data.history || []).slice(-5).reverse().forEach(h=>{
        t.innerHTML += `<div>
            <b>${h.type}</b>: ${h.input || h.fix}
        </div>`;
    });
}

</script>

</body>
</html>
