<!DOCTYPE html>
<html>
<head>
<title>AI Helpdesk</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #0b1220;
    color: white;
    font-family: Arial;
}

/* SIDEBAR */
.sidebar {
    width: 200px;
    background: #0f172a;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* MAIN AREA */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* CHAT AREA */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* MESSAGES */
.msg {
    max-width: 65%;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.bot {
    background: #1f2937;
    align-self: flex-start;
}

/* INPUT BAR (LOCKED BOTTOM) */
.inputbar {
    display: flex;
    padding: 10px;
    border-top: 1px solid #1f2937;
    background: #0f172a;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: #1f2937;
    color: white;
}

button {
    margin-left: 10px;
    padding: 10px;
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

/* RIGHT PANEL */
.right {
    width: 300px;
    background: #0f172a;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card {
    background: #1f2937;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
}

/* FIX BUTTONS */
.fixbtn {
    background: #334155;
    padding: 6px;
    margin-top: 5px;
    border-radius: 5px;
    cursor: pointer;
}

.fixbtn:hover {
    background: #475569;
}

/* LOGOUT */
.logout {
    margin-top: auto;
    padding: 8px;
    background: #7f1d1d;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LEFT SIDEBAR -->
<div class="sidebar">
    <div>
        <b>Sessions</b>
    </div>

    <div class="logout" onclick="logout()">Logout</div>
</div>

<!-- MAIN -->
<div class="main">

    <div id="chat" class="chat"></div>

    <div class="inputbar">
        <input id="input" placeholder="Describe the issue..." />
        <button onclick="send()">Send</button>
    </div>

</div>

<!-- RIGHT PANEL -->
<div class="right">

    <div class="card">
        <b>Status</b>
        <div id="mode">Diagnostic</div>
    </div>

    <div class="card">
        <b>Case Facts</b>
        <div id="facts">None yet</div>
    </div>

    <div class="card">
        <b>Diagnostic Tree</b>
        <div id="tree"></div>
    </div>

    <div class="card">
        <b>Quick Fixes</b>
        <div id="fixes">None yet</div>
    </div>

</div>

<script>

let messages = [];

/* RENDER CHAT */
function render() {
    const chat = document.getElementById("chat");
    chat.innerHTML = "";

    messages.forEach(m => {
        let div = document.createElement("div");
        div.className = "msg " + (m.role === "user" ? "user" : "bot");
        div.innerText = m.content;
        chat.appendChild(div);
    });

    chat.scrollTop = chat.scrollHeight;
}

/* UPDATE RIGHT PANEL */
function updateUI(facts, fixMode) {

    // Status
    document.getElementById("mode").innerText =
        fixMode ? "FIX MODE" : "Diagnostic";

    // Facts
    const factsBox = document.getElementById("facts");
    factsBox.innerHTML = "";

    if (Object.keys(facts).length === 0) {
        factsBox.innerText = "None yet";
    } else {
        Object.entries(facts).forEach(([k,v]) => {
            let div = document.createElement("div");
            div.innerText = k + ": " + v;
            factsBox.appendChild(div);
        });
    }

    // Diagnostic Tree
    const tree = document.getElementById("tree");
    tree.innerHTML = "";

    const keys = ["connection","os","printer","recognized","issue"];

    keys.forEach(k => {
        let div = document.createElement("div");
        div.innerText = (facts[k] ? "✔ " : "○ ") + k;
        tree.appendChild(div);
    });
}

/* QUICK FIXES */
function extractFixes(text) {
    const box = document.getElementById("fixes");
    box.innerHTML = "";

    let found = false;

    text.split("\n").forEach(line => {
        if (line.toLowerCase().includes("fix:")) {
            found = true;

            let btn = document.createElement("div");
            btn.className = "fixbtn";
            btn.innerText = line.replace(/fix:/i, "").trim();

            btn.onclick = () => {
                const input = document.getElementById("input");
                input.value = btn.innerText;
                input.focus();
            };

            box.appendChild(btn);
        }
    });

    if (!found) box.innerText = "None yet";
}

/* SEND MESSAGE */
async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    messages.push({role:"user", content:text});
    render();

    input.value = "";
    input.focus();

    const res = await fetch("/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:text})
    });

    const data = await res.json();

    messages.push({role:"assistant", content:data.response});
    render();

    updateUI(data.facts, data.fix_mode);
    extractFixes(data.response);
}

/* ENTER KEY */
document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        send();
    }
});

/* LOGOUT */
function logout() {
    location.reload(); // placeholder (we can wire real auth later)
}

</script>

</body>
</html>
