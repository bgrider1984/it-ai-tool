<!DOCTYPE html>
<html>
<head>
<style>
body {margin:0;display:flex;height:100vh;background:#0b1220;color:white;font-family:Arial;}

.sidebar {width:200px;background:#0f172a;padding:10px;display:flex;flex-direction:column;}
.session {padding:6px;background:#1f2937;margin:4px 0;cursor:pointer;}

.main {flex:1;display:flex;flex-direction:column;}
.chat {flex:1;overflow-y:auto;padding:10px;}
.msg {padding:10px;margin:5px;border-radius:8px;max-width:60%;}
.user {background:#2563eb;margin-left:auto;}
.bot {background:#1f2937;}

.inputbar {display:flex;padding:10px;}
input {flex:1;padding:10px;background:#1f2937;color:white;border:none;}
button {margin-left:10px;}

.right {width:280px;background:#0f172a;padding:10px;}

.fixbtn {background:#334155;padding:6px;margin-top:5px;cursor:pointer;}
</style>
</head>

<body>

<div class="sidebar">
    <b>Sessions</b>
    <div id="sessions"></div>
    <button onclick="logout()">Logout</button>
</div>

<div class="main">
    <div id="chat" class="chat"></div>
    <div class="inputbar">
        <input id="input">
        <button onclick="send()">Send</button>
    </div>
</div>

<div class="right">
    <div><b>Status:</b> <span id="mode"></span></div>
    <div><b>Facts:</b><div id="facts"></div></div>
    <div><b>Fixes:</b><div id="fixes"></div></div>
</div>

<script>
let messages = [];

function render(){
    let c = document.getElementById("chat");
    c.innerHTML="";
    messages.forEach(m=>{
        let d=document.createElement("div");
        d.className="msg "+(m.role=="user"?"user":"bot");
        d.innerText=m.content;
        c.appendChild(d);
    });
}

function updateUI(data){
    document.getElementById("mode").innerText = data.fix_mode ? "FIX MODE":"Diagnostic";

    let f=document.getElementById("facts");
    f.innerHTML="";
    Object.entries(data.facts).forEach(([k,v])=>{
        let d=document.createElement("div");
        d.innerText=k+": "+v;
        f.appendChild(d);
    });

    let s=document.getElementById("sessions");
    s.innerHTML="";
    data.sessions.forEach(id=>{
        let d=document.createElement("div");
        d.className="session";
        d.innerText=id;
        d.onclick=()=>loadSession(id);
        s.appendChild(d);
    });

    extractFixes(messages[messages.length-1].content);
}

function extractFixes(text){
    let box=document.getElementById("fixes");
    box.innerHTML="";
    text.split("\\n").forEach(l=>{
        if(l.toLowerCase().includes("fix:")){
            let b=document.createElement("div");
            b.className="fixbtn";
            b.innerText=l.replace(/fix:/i,"");
            b.onclick=()=>sendFix(b.innerText);
            box.appendChild(b);
        }
    });
}

async function send(){
    let input=document.getElementById("input");
    let text=input.value;
    if(!text) return;

    messages.push({role:"user",content:text});
    render();

    input.value="";

    let res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
    let data=await res.json();

    messages.push({role:"assistant",content:data.response});
    render();

    updateUI(data);
}

async function sendFix(fix){
    send(fix);
}

async function loadSession(id){
    let res=await fetch("/load_session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid:id})});
    let data=await res.json();
    messages=data;
    render();
}

function logout(){
    window.location.href="/logout";
}

document.getElementById("input").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();send();}
});
</script>

</body>
</html>
