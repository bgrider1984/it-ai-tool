<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Helpdesk v7</title>

<style>
body { margin:0; font-family:Arial; background:#0f172a; color:#e2e8f0; }
header { padding:15px; background:#111827; font-weight:bold; }

.container {
    display:grid;
    grid-template-columns: 2fr 1fr;
    height: calc(100vh - 60px);
}

.left, .right { padding:20px; }
.left { border-right:1px solid #1f2937; }

textarea {
    width:100%;
    height:100px;
    background:#1f2937;
    color:white;
    border:none;
    padding:10px;
}

button { margin-top:10px; padding:10px; background:#2563eb; border:none; color:white; cursor:pointer; }

.card {
    background:#1f2937;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

.title { color:#60a5fa; font-weight:bold; margin-bottom:10px; }
.alert { color:#f87171; }
.metric { margin-bottom:5px; }
.item { margin-bottom:5px; }
</style>
</head>

<body>

<header>AI Helpdesk v7 — Monitoring Enabled</header>

<div class="container">

<div class="left">

<h3>Describe Issue</h3>
<textarea id="input"></textarea>

<button onclick="run()">Analyze</button>
<button onclick="run(true)">Auto Fix</button>

<div class="card">
<div class="title">Analysis</div>
<div id="analysis"></div>
</div>

<div class="card">
<div class="title">Fixes</div>
<div id="fixes"></div>
</div>

<div class="card">
<div class="title">Timeline</div>
<div id="timeline"></div>
</div>

</div>

<div class="right">

<div class="card">
<div class="title">System Metrics</div>
<div id="metrics"></div>
</div>

<div class="card">
<div class="title">Alerts</div>
<div id="alerts"></div>
</div>

<div class="card">
<div class="title">Tool Output</div>
<div id="tool"></div>
</div>

</div>

</div>

<script>

async function run(autoFix=false){
    const text = document.getElementById("input").value;

    const res = await fetch("/api/run",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text, auto_fix:autoFix})
    });

    const data = await res.json();
    const r = data.result;

    document.getElementById("analysis").innerText = r.analysis;

    const fixes = document.getElementById("fixes");
    fixes.innerHTML = "";
    (r.fixes||[]).forEach(f=>{
        fixes.innerHTML += "<div class='item'>→ "+f+"</div>";
    });

    document.getElementById("tool").innerText =
        data.tool_result ? data.tool_result.output : "None";

    loadTimeline();
}


async function loadTimeline(){
    const res = await fetch("/api/case");
    const data = await res.json();

    const div = document.getElementById("timeline");
    div.innerHTML = "";

    (data.history||[]).slice(-5).reverse().forEach(h=>{
        div.innerHTML += `<div class='item'>
            <b>Input:</b> ${h.input}<br>
            <b>Result:</b> ${h.analysis}
        </div>`;
    });
}


async function loadMonitor(){
    const res = await fetch("/api/monitor");
    const data = await res.json();

    const m = data.metrics;
    const a = data.alerts;

    document.getElementById("metrics").innerHTML = `
        <div class="metric">CPU: ${m.cpu}%</div>
        <div class="metric">Memory: ${m.memory}%</div>
    `;

    const alertsDiv = document.getElementById("alerts");
    alertsDiv.innerHTML = "";

    a.forEach(alert=>{
        alertsDiv.innerHTML += `<div class="alert">⚠ ${alert}</div>`;
    });
}

// refresh every 3 sec
setInterval(loadMonitor, 3000);

</script>
 
</body>
</html>
