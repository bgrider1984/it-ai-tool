<!DOCTYPE html>
<html>
<head>
<title>Smart Helpdesk Copilot v8</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b1220;
    color:white;
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar {
    width:260px;
    background:#111827;
    padding:12px;
    overflow-y:auto;
    border-right:1px solid #1f2937;
}

.sidebar h3 {
    margin-top:0;
}

/* MAIN AREA */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px;
}

/* CHAT */
.chat {
    flex:1;
    background:#1f2937;
    border-radius:10px;
    padding:15px;
    overflow-y:auto;
    margin-bottom:10px;
}

.msg {
    margin:10px 0;
    padding:10px 12px;
    border-radius:8px;
    white-space:pre-wrap;
    line-height:1.4;
}

.user {
    background:#2563eb;
    align-self:flex-end;
}

.bot {
    background:#374151;
}

/* INPUT */
.input-area {
    display:flex;
    gap:10px;
}

input {
    flex:1;
    padding:12px;
    border-radius:6px;
    border:none;
    outline:none;
}

button {
    padding:12px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#22c55e;
    color:white;
    font-weight:bold;
}

button:hover {
    background:#16a34a;
}

/* QUICK ACTIONS */
#quickActions {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.quick-btn {
    background:#334155;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
}

.quick-btn:hover {
    background:#475569;
}

/* TOP BAR */
.topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.small-btn {
    background:#ef4444;
}

.small-btn:hover {
    background:#dc2626;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h3>Sessions</h3>
    <button onclick="resetChat()">+ New Issue</button>
    <div id="sessionList"></div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="topbar">
        <h2>Smart Helpdesk Copilot v8</h2>
        <button class="small-btn" onclick="resetChat()">Reset</button>
    </div>

    <div id="chat" class="chat"></div>

    <!-- QUICK ACTIONS -->
    <div id="quickActions"></div>

    <div class="input-area">
        <input id="input" placeholder="Describe your issue..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

// ----------------------------
// ADD MESSAGE
// ----------------------------
function addMessage(text, type){
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// ----------------------------
// QUICK ACTIONS RENDER
// ----------------------------
function renderQuickActions(actions){

    const box = document.getElementById("quickActions");
    box.innerHTML = "";

    if(!actions || actions.length === 0) return;

    actions.forEach(action => {

        const btn = document.createElement("button");
        btn.className = "quick-btn";
        btn.textContent = action;

        btn.onclick = () => {
            input.value = action;
            sendMessage();
        };

        box.appendChild(btn);
    });
}

// ----------------------------
// SEND MESSAGE (ROBUST)
// ----------------------------
async function sendMessage(){

    const msg = input.value.trim();
    if(!msg) return;

    addMessage(msg, "user");
    input.value = "";

    try {

        const res = await fetch("/ask", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        if(!res.ok){
            addMessage("⚠ Error: " + (data.response || "Server issue"), "bot");
            return;
        }

        addMessage(data.response || "No response received", "bot");

        // render AI quick actions
        renderQuickActions(data.quick_actions);

    } catch (err) {
        console.error(err);
        addMessage("⚠ Network error contacting server", "bot");
    }
}

// ----------------------------
// ENTER KEY FIX
// ----------------------------
input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
    }
});

// ----------------------------
// RESET CHAT
// ----------------------------
async function resetChat(){
    await fetch("/reset", {method:"POST"});
    chat.innerHTML = "";
    document.getElementById("quickActions").innerHTML = "";
    addMessage("New issue started. Describe your problem.", "bot");
}

// ----------------------------
// PLACEHOLDER SESSIONS
// ----------------------------
function loadSessions(){
    const box = document.getElementById("sessionList");
    box.innerHTML = "";

    const item = document.createElement("div");
    item.className = "msg bot";
    item.textContent = "Current Session";

    box.appendChild(item);
}

loadSessions();

</script>

</body>
</html>
