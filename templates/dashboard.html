<!-- ADD THIS CARD INSIDE RIGHT PANEL -->
<div class="card">
    <b>Analytics</b>
    <div id="analytics"></div>
</div>

<script>

// ADD THIS FUNCTION
function updateAnalytics(data){
    let a=document.getElementById("analytics");
    a.innerHTML="";

    a.innerHTML += "Fixes Run: " + data.fixes_run + "<br>";

    Object.entries(data.issues).forEach(([k,v])=>{
        a.innerHTML += k + ": " + v + "<br>";
    });
}

// MODIFY extractFixes
function extractFixes(text){
    let box=document.getElementById("fixes");
    box.innerHTML="";

    text.split("\n").forEach(l=>{
        if(l.toLowerCase().includes("fix:")){
            let b=document.createElement("div");
            b.className="fixbtn";
            b.innerText=l.replace(/fix:/i,"");

            b.onclick=async ()=>{
                let res=await fetch("/run_fix",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({fix:b.innerText})
                });
                let data=await res.json();
                alert(data.result);
            };

            box.appendChild(b);
        }
    });
}

// MODIFY send()
updateUI(data);
updateAnalytics(data.analytics);

</script>
