<!DOCTYPE html>
<html>
<head>
<title>Helpdesk Intelligence v9</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b1220;
    color:white;
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar {
    width:260px;
    background:#111827;
    padding:10px;
}

.session {
    background:#1f2937;
    padding:8px;
    margin:6px 0;
    cursor:pointer;
    border-radius:6px;
}

/* MAIN */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
    padding:15px;
}

/* CHAT */
.chat {
    flex:1;
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

/* FIXED BUBBLES (IMPORTANT) */
.msg {
    display:inline-block;
    max-width:70%;
    padding:10px 12px;
    border-radius:10px;
    margin:6px 0;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.user {
    background:#2563eb;
    align-self:flex-end;
}

.bot {
    background:#374151;
    align-self:flex-start;
}

/* INPUT */
.input-area {
    display:flex;
    gap:10px;
    margin-top:10px;
}

input {
    flex:1;
    padding:10px;
}

button {
    padding:10px;
    background:#22c55e;
    border:none;
    color:white;
    cursor:pointer;
}

/* TOP */
.top {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="sidebar">
    <button onclick="newSession()">+ New</button>
    <div id="sessions"></div>
</div>

<div class="main">

<div class="top">
    <h3>Helpdesk v9 Routing</h3>
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
    <input id="input">
    <button onclick="send()">Send</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");

function add(text, type){
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send(){

    const msg = input.value.trim();
    if(!msg) return;

    add(msg,"user");
    input.value="";

    const res = await fetch("/ask",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:msg})
    });

    const data = await res.json();

    add(data.response,"bot");
    renderSessions(data.sessions);
}

function renderSessions(sessions){
    const box = document.getElementById("sessions");
    box.innerHTML="";

    sessions.forEach(s=>{
        const d=document.createElement("div");
        d.className="session";
        d.textContent=s.title;
        d.onclick=()=>load(s);
        box.appendChild(d);
    });
}

function load(s){
    chat.innerHTML="";
    s.messages.forEach(m=>{
        add(m.text,m.role);
    });
}

async function newSession(){
    await fetch("/new",{method:"POST"});
    location.reload();
}

</script>

</body>
</html>
