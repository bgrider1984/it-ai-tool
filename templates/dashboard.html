<!DOCTYPE html>
<html>
<head>
<title>AI Helpdesk</title>
<style>
body { margin:0; display:flex; background:#0b1220; color:white; font-family:Arial; }

/* LEFT */
.sidebar { width:200px; background:#0f172a; padding:10px; }

/* CENTER */
.main { flex:1; display:flex; flex-direction:column; }

.chat { flex:1; padding:10px; overflow-y:auto; }

.msg { padding:10px; margin:5px; border-radius:8px; max-width:70%; }
.user { background:#2563eb; margin-left:auto; }
.bot { background:#1f2937; }

.inputbar { display:flex; padding:10px; }
input { flex:1; padding:10px; background:#1f2937; color:white; border:none; }
button { margin-left:10px; }

/* RIGHT PANEL */
.right { width:300px; background:#0f172a; padding:10px; }

.card { background:#1f2937; padding:10px; margin-bottom:10px; }

.fixbtn { background:#334155; padding:6px; margin-top:5px; cursor:pointer; }
.fixbtn:hover { background:#475569; }
</style>
</head>

<body>

<div class="sidebar">
    <b>Sessions</b>
</div>

<div class="main">
    <div id="chat" class="chat"></div>

    <div class="inputbar">
        <input id="input" />
        <button onclick="send()">Send</button>
    </div>
</div>

<div class="right">

    <div class="card">
        <b>Status</b>
        <div id="mode">Diagnostic</div>
    </div>

    <div class="card">
        <b>Case Facts</b>
        <div id="facts"></div>
    </div>

    <div class="card">
        <b>Diagnostic Tree</b>
        <div id="tree"></div>
    </div>

    <div class="card">
        <b>Quick Fixes</b>
        <div id="fixes"></div>
    </div>

</div>

<script>
let messages = [];

function render() {
    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    messages.forEach(m => {
        let d = document.createElement("div");
        d.className = "msg " + (m.role==="user"?"user":"bot");
        d.innerText = m.content;
        chat.appendChild(d);
    });
}

function updateFacts(facts, fixMode) {
    const f = document.getElementById("facts");
    f.innerHTML = "";

    Object.keys(facts).forEach(k => {
        let div = document.createElement("div");
        div.innerText = k + ": " + facts[k];
        f.appendChild(div);
    });

    document.getElementById("mode").innerText = fixMode ? "FIX MODE" : "Diagnostic";

    // Diagnostic tree
    const tree = document.getElementById("tree");
    tree.innerHTML = "";

    ["connection","os","printer","recognized","issue"].forEach(key => {
        let div = document.createElement("div");
        if (facts[key]) {
            div.innerText = "✔ " + key;
        } else {
            div.innerText = "○ " + key;
        }
        tree.appendChild(div);
    });
}

function extractFixes(text) {
    const box = document.getElementById("fixes");
    box.innerHTML = "";

    text.split("\n").forEach(line => {
        if (line.toLowerCase().includes("fix:")) {
            let b = document.createElement("div");
            b.className = "fixbtn";
            b.innerText = line.replace(/fix:/i,"");
            box.appendChild(b);
        }
    });
}

async function send() {
    let input = document.getElementById("input");
    let text = input.value;
    if (!text) return;

    messages.push({role:"user", content:text});
    render();

    input.value = "";
    input.focus();

    let res = await fetch("/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:text})
    });

    let data = await res.json();

    messages.push({role:"assistant", content:data.response});
    render();

    updateFacts(data.facts, data.fix_mode);
    extractFixes(data.response);
}

// ENTER KEY
document.getElementById("input").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); send(); }
});
</script>

</body>
</html>
