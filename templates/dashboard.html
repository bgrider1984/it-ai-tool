<!-- ONLY showing FIXES section + JS CHANGES (rest stays same as v7.1) -->

<div class="card">
<div class="title">Suggested Fixes</div>
<div id="fixes"></div>
</div>

<script>

async function run(autoFix=false){
    const text = document.getElementById("input").value;

    const res = await fetch("/api/run",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text})
    });

    const data = await res.json();
    const r = data.result;

    document.getElementById("analysis").innerText = r.analysis || "No analysis";

    const fixesDiv = document.getElementById("fixes");
    fixesDiv.innerHTML = "";

    (r.fixes||[]).forEach(f=>{
        fixesDiv.innerHTML += `
        <div class="item">
            → ${f}
            <button onclick="runFix('${f}')">Run</button>
            <button onclick="verifyFix('${f}')">Verify</button>
        </div>`;
    });
}


async function runFix(fix){
    const res = await fetch("/api/fix",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix})
    });

    const data = await res.json();
    alert("Fix executed:\n" + data.output);

    loadTimeline();
}


async function verifyFix(fix){
    const res = await fetch("/api/verify",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fix})
    });

    const data = await res.json();
    alert("Verification result:\n" + data.verification);

    loadTimeline();
}

</script>
