<!DOCTYPE html>
<html>
<head>
<title>Helpdesk v13 Stable</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b1220;
    color:white;
    display:flex;
    height:100vh;
}

.main {
    flex:1;
    display:flex;
    flex-direction:column;
    padding:15px;
}

.chat {
    flex:1;
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.msg {
    display:inline-block;
    max-width:65%;
    width:fit-content;
    padding:10px;
    border-radius:10px;
    margin:6px 0;
    white-space:pre-wrap;
}

.user { background:#2563eb; align-self:flex-end; }
.bot { background:#374151; align-self:flex-start; }

.input {
    display:flex;
    gap:10px;
    margin-top:10px;
}

input {
    flex:1;
    padding:10px;
}

button {
    padding:10px;
    background:#22c55e;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="main">

<h3>Helpdesk v13 Stable</h3>

<div id="chat" class="chat"></div>

<div class="input">
    <input id="input">
    <button onclick="send()">Send</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

function add(text,type){
    const d=document.createElement("div");
    d.className="msg "+type;
    d.textContent=text;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
}

async function send(){

    const msg = input.value.trim();
    if(!msg) return;

    add(msg,"user");
    input.value="";

    try {

        const res = await fetch("/ask",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:msg})
        });

        const data = await res.json();

        // SAFE GUARDS (CRITICAL)
        if(!data || !data.response){
            add("⚠ No response received","bot");
            return;
        }

        add(data.response,"bot");

        console.log("DEBUG:", data.debug);

    } catch (e) {
        add("⚠ Network error","bot");
    }
}

input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        e.preventDefault();
        send();
    }
});

add("System ready (v13 stable).","bot");

</script>

</body>
</html>
